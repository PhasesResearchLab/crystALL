[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "crystall"
version = "0.5.0"
authors = [
  { name="Ricardo Amaral", email="rna5137@psu.edu" },
  { name="Adam Krajewski", email="adam@phaseslab.org" },
  { name="Jonathan Siegel", email="jwsiegel@tamu.edu" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Database :: Front-Ends",
]
description = "Pure data-driven structure prediction combining MPDD's Big Data (ALL 'crystals') from DFT with high-throughput substitutions, stability predictions, candidate selection, and DFT+experiment validation. Developed since 2021 and demonstrated in the identification of new atomic structures in Nd-Bi and Al-Fe systems."
readme = "README.md"

requires-python = ">=3.11, <3.13"
dependencies = [
    "pysipfenn>=0.18.0",
    "mpdd-alignn>=1.3.1",
    "chgnet==0.3.8",
    "torch>=2.3.0",
    "torchdata==0.9.0",
    "dgl>=2.2.0",
    "pymatgen>=2024.2.20, <=2025.10.7",
    "emmet-core>=0.87.0",
    "spglib>=2.5.0",
    "numpy>=2.0.0",
    "tqdm>=4.65.0",
    "nbformat>=5",
    "natsort>=8.3.0",
    "pymongo>=4.4",
    "pysmartdl2>=2.0.0",
    "colorama>=0.4.6",
    "yaspin",
    "dnspython",
    "ruamel.yaml",
    "distinctipy",
    "scipy",
    "scikit-learn"
]

[tool.setuptools]
packages = { find = { exclude = ["paper", "oldfiles"] } }

[tool.setuptools.package-data]
"crystall.utils" = ["*.yaml"]

[project.urls]
"Documentation" = "https://crystall.readthedocs.io"
"Repository" = "https://github.com/PhasesResearchLab/crystALL"

[project.entry-points."crystall.calculators"]
ALIGNN = "crystall.calculators.alignn:AlignnAdapter"
CHGNetStatic = "crystall.calculators.chgnet:CHGNetStaticAdapter"
CHGNetRelax = "crystall.calculators.chgnet:CHGNetRelaxAdapter"
