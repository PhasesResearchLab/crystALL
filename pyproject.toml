[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "crystall-search"
version = "0.5.2"
authors = [
  { name="Ricardo Amaral", email="rna5137@psu.edu" },
  { name="Adam Krajewski", email="adam@phaseslab.org" },
  { name="Jonathan Siegel", email="jwsiegel@tamu.edu" },
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = [
    "materials-science",
    "crystallography",
    "crystal-structure-prediction",
    "materials-discovery",
    "machine-learning",
    "ergodic-ensembles",
    "convex-hull",
    "mpdd",
    "optimade",
]
description = "Data-driven crystal structure prediction and ergodic candidate ensemble discovery beyond the convex hull, embracing structural diversity and compositional uncertainty. Under name crystall-search on PyPI."
readme = "README.md"

requires-python = ">=3.11, <3.13"
dependencies = [
    "pysipfenn>=0.18.0",
    "mpdd-alignn>=1.3.1; sys_platform == 'linux'",
    "chgnet==0.4.2",
    "torch>=2.3.0",
    "torchdata==0.9.0; sys_platform == 'linux'",
    "dgl>=2.2.0; sys_platform == 'linux'",
    "pymatgen>=2024.2.20, <=2025.10.7",
    "emmet-core>=0.87.0",
    "spglib>=2.5.0",
    "numpy>=2.0.0",
    "tqdm>=4.65.0",
    "nbformat>=5",
    "natsort>=8.3.0",
    "pymongo>=4.4",
    "pysmartdl2>=2.0.0",
    "colorama>=0.4.6",
    "yaspin",
    "dnspython",
    "ruamel.yaml",
    "distinctipy",
    "scipy",
    "scikit-learn",
    "pandas",
    "plotly",
]

[project.optional-dependencies]
alignn = [
    "mpdd-alignn>=1.3.1",
    "dgl>=2.2.0",
    "torchdata==0.9.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov",
    "pytest-order",
    "flask",
]
docs = [
    "sphinx>5.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-rtd-size",
    "sphinx-autodoc-typehints",
    "sphinx-github-changelog>=1.2.1",
    "myst-nb>=0.17.2",
]
dev = [
    "crystall-search[test,docs]",
    "black",
    "flake8",
    "isort",
]

[tool.setuptools]
packages = { find = { exclude = ["paper", "oldfiles"] } }

[tool.setuptools.package-data]
"crystall.utils" = ["*.yaml"]

[project.urls]
"Documentation" = "https://crystall.readthedocs.io"
"Repository" = "https://github.com/PhasesResearchLab/crystALL"

[project.entry-points."crystall.calculators"]
ALIGNN = "crystall.calculators.alignn:AlignnAdapter"
CHGNetStatic = "crystall.calculators.chgnet:CHGNetStaticAdapter"
CHGNetRelax = "crystall.calculators.chgnet:CHGNetRelaxAdapter"
