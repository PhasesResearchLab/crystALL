name: Mac M1

on: 
  push:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_Mac.yaml'
      - 'pyproject.toml'
  
  pull_request:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_Mac.yaml'
      - 'pyproject.toml'

  workflow_dispatch:

jobs:
  coreTest:
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install and run MongoDB
        run: |
          brew trust mongodb/brew
          brew tap mongodb/brew
          brew install mongodb-community@8.0
          brew services start mongodb/brew/mongodb-community@8.0

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install wheel flask pytest pytest-order
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.7.0" "torchvision==0.22.0" "torchdata==0.9.0"
          conda install -c dglteam dgl
          python -m pip install -e .

      - name: Test with pytest
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          pytest -s --durations=0

      - name: Delay next job
        run: sleep 15
