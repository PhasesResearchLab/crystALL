name: Mac M1

on: 
  push:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_Mac.yaml'
  
  pull_request:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_Mac.yaml'

  workflow_dispatch:

jobs:
  coreTest:
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install and run MongoDB
        run: |
          brew tap mongodb/brew
          brew install mongodb-community@8.0
          brew services start mongodb/brew/mongodb-community@8.0
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install wheel flask pytest pytest-order pytest-cov
          python -m pip install 'dgl==2.2.0' -f https://data.dgl.ai/wheels/torch-2.3/repo.html
          python -m pip install -e .

      - name: Download pysipfenn models
        run: |
          python -c "from pysipfenn import Calculator; Calculator().downloadModels('SIPFENN_Krajewski2022_NN30')"

      - name: Test with pytest
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest -s --durations=0 --cov=crystall --cov-report=xml;
          else
            pytest -s --durations=0;
          fi

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ github.run_id }}-${{ matrix.python-version }}
          path: coverage.xml

      - name: Delay next job
        run: sleep 15