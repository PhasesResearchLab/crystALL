name: Mac M1

on: 
  #push:
  #  branches: [main]
  #  paths:
  #    - 'crystall/**'
  #    - '.github/workflows/coreTests_Mac.yaml'
  #    - 'pyproject.toml'
  #
  #pull_request:
  #  branches: [main]
  #  paths:
  #    - 'crystall/**'
  #    - '.github/workflows/coreTests_Mac.yaml'
  #    - 'pyproject.toml'

  workflow_dispatch:

jobs:
  coreTest:
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      
      - name: Install and run MongoDB
        run: |
          brew trust mongodb/brew
          brew tap mongodb/brew
          brew install mongodb-community@9.0
          brew services start mongodb/brew/mongodb-community@9.0
          for i in {1..30}; do
            if command -v mongosh >/dev/null 2>&1; then
              mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
            else
              nc -z localhost 27017 >/dev/null 2>&1 && break
            fi
            sleep 1
          done

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.7.0"
          python -m pip install -e ".[test]"

      - name: Test with pytest
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          pytest -s --durations=0

      - name: Delay next job
        run: sleep 15
