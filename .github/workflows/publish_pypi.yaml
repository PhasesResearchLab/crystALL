name: publish_pypi

on:
  release:
    types: [published]

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        env:
          # TODO: configure PyPI token or OIDC trusted publisher
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "Configure PyPI publish here."
          echo "Token present: ${PYPI_API_TOKEN:+yes}"
          # TODO: replace with twine upload or pypa/gh-action-pypi-publish
