name: Windows (core)

on: 
  push:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_Windows.yaml'
      - 'pyproject.toml'
  
  pull_request:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_Windows.yaml'
      - 'pyproject.toml'

  workflow_dispatch:

jobs:
  coreTest:
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install and start MongoDB (Windows)
        run: |
          if (-not (Get-Service -Name MongoDB -ErrorAction SilentlyContinue)) {
            choco install mongodb --no-progress -y
          }
          Set-Service -Name MongoDB -StartupType Automatic
          Start-Service -Name MongoDB
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $tcp = New-Object System.Net.Sockets.TcpClient("127.0.0.1", 27017)
              $tcp.Close()
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.7.0+cpu"
          python -m pip install -e ".[test]"

      - name: Test with pytest
        env:
          PYTHONUTF8: "1"
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          pytest -s --durations=0

      - name: Delay next job
        run: sleep 15