name: Windows

on: 
  push:
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_Windows.yaml'
  workflow_dispatch:

jobs:
  coreTest:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MongoDB (Windows)
        run: |
          Set-Service mongodb -StartupType Automatic          
          Start-Service -Name mongodb

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          miniconda-version: "latest"

      - name: Create conda environment
        shell: powershell
        run: |
          $envName = "ci-${{ matrix.python-version }}"
          conda create -y -n $envName python=${{ matrix.python-version }}

      - name: Install PyTorch (CPU) into env
        shell: powershell
        run: |
          $envName = "ci-${{ matrix.python-version }}"
          conda run -n $envName conda install -y -c pytorch -c conda-forge pytorch cpuonly

      - name: Install DGL via conda (dglteam)
        shell: powershell
        run: |
          $envName = "ci-${{ matrix.python-version }}"
          conda run -n $envName conda install -y -c dglteam "dgl>=2.0.0"

      - name: Install remaining Python deps and the project (editable mode)
        shell: powershell
        run: |
          $envName = "ci-${{ matrix.python-version }}"
          conda run -n $envName python -m pip install --upgrade pip setuptools
          conda run -n $envName python -m pip install wheel flask pytest pytest-order
          conda run -n $envName python -m pip install -e .

      - name: Test with pytest
        shell: powershell
        run: |
          $envName = "ci-${{ matrix.python-version }}"
          conda run -n $envName pytest -s --durations=0

      - name: Delay next job
        if: ${{ matrix.python-version != '3.11' }}
        run: sleep 15
