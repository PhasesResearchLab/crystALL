name: Update docs

on:
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install metadata tooling
        run: python -m pip install --upgrade pip tomlkit

      - name: Update README, pyproject, citation
        run: python .github/scripts/update_metadata.py

      - name: Commit updated files
        run: |
          git add README.md pyproject.toml citation.cff
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Update docs and metadata"

      - name: Show git status
        run: git status --short
