name: Linux (E2E incl. ML runtime)

on:
  pull_request:
    branches:
      - main
  push:
    paths:
      - '.github/workflows/fullTests.yaml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  testPython311:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:9.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Free up disk space before dependency install
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          docker rmi $(docker images -q) || true
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install wheel flask pytest pytest-order pytest-cov
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.7.0+cpu" "torchvision==0.22.0+cpu" "torchdata==0.9.0"
          python -m pip install --no-deps 'dgl==2.5.0' -f https://data.dgl.ai/wheels/torch-2.6/repo.html
          python -m pip install -e .

      - name: Download pySIPFENN models
        id: DownloadModelsAttempt1
        run: |
          python -c "from pysipfenn import Calculator; c = Calculator(); c.downloadModels('SIPFENN_Krajewski2022_NN30'); c.loadModels()"
        continue-on-error: true

      - name: Download pySIPFENN models retry if failed the first time
        if: steps.DownloadModelsAttempt1.outcome == 'failure'
        run: |
          python -c "import time; time.sleep(120); from pysipfenn import Calculator; c = Calculator(autoLoad=False); c.downloadModels('SIPFENN_Krajewski2022_NN30'); c.loadModels()"

      - name: Test with pytest
        env:
          MODELS_FETCHED: true
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          pytest -s --durations=0 --cov=crystall --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.run_id }}-3.11
          path: coverage.xml

      - name: Delay next job
        run: sleep 15

  testPython312:
    needs: testPython311
    timeout-minutes: 120
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:9.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Free up disk space before dependency install
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          docker rmi $(docker images -q) || true
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install wheel flask pytest pytest-order pytest-cov
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.7.0+cpu" "torchvision==0.22.0+cpu" "torchdata==0.9.0"
          python -m pip install --no-deps 'dgl==2.5.0' -f https://data.dgl.ai/wheels/torch-2.6/repo.html
          python -m pip install -e .

      - name: Download pySIPFENN models
        id: DownloadModelsAttempt1
        run: |
          python -c "from pysipfenn import Calculator; c = Calculator(); c.downloadModels('SIPFENN_Krajewski2022_NN30'); c.loadModels()"
        continue-on-error: true

      - name: Download pySIPFENN models retry if failed the first time
        if: steps.DownloadModelsAttempt1.outcome == 'failure'
        run: |
          python -c "import time; time.sleep(120); from pysipfenn import Calculator; c = Calculator(autoLoad=False); c.downloadModels('SIPFENN_Krajewski2022_NN30'); c.loadModels()"

      - name: Test with pytest
        env:
          MODELS_FETCHED: true
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          pytest -s --durations=0
