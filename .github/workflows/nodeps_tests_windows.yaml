name: NoDeps Tests Windows

on: 
  push:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/nodeps_tests_windows.yaml'
  
  pull_request:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/nodeps_tests_windows.yaml'

  workflow_dispatch:

jobs:
  coreTest:
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB (Windows)
        run: |
          Set-Service mongodb -StartupType Automatic          
          Start-Service -Name mongodb
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install wheel flask pytest pytest-order
          python -m pip install 'dgl==2.2.0' -f https://data.dgl.ai/wheels/torch-2.3/repo.html
          python -m pip install -e .

      - name: Test with pytest
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          pytest -s --durations=0

      - name: Delay next job
        run: sleep 15