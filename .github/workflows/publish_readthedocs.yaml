name: publish_readthedocs

on:
  release:
    types: [published]

jobs:
  publish-readthedocs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          # TODO: replace with your docs requirements file or extras
          # python -m pip install -r docs/requirements.txt
          # python -m pip install -e .[docs]
          python -m pip install sphinx

      - name: Build Sphinx documentation
        run: |
          # TODO: adjust docs source/build paths to match your project
          sphinx-build -b html docs docs/_build/html

      - name: Publish to Read the Docs
        env:
          # TODO: add Read the Docs integration token as a repo secret
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: |
          echo "Configure Read the Docs deployment here."
          echo "Token present: ${READTHEDOCS_TOKEN:+yes}"
          # TODO: replace with official RTD deploy webhook or API call
