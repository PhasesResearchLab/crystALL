name: Linux

on: 
  push:
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_LinuxUbuntu.yaml'
  workflow_dispatch:

jobs:
  coreTest:
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '6.0'
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      
      - name: Free up disk space before dependency install
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          docker rmi $(docker images -q) || true
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install wheel flask pytest pytest-order pytest-cov
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.3.0+cpu" "torchvision==0.18.0+cpu" "torchdata==0.9.0"
          python -m pip install --no-deps 'dgl==2.2.0' -f https://data.dgl.ai/wheels/torch-2.3/repo.html
          python -m pip install -e .

      - name: Download pysipfenn models
        run: |
          python -c "from pysipfenn import Calculator; Calculator().downloadModels('SIPFENN_Krajewski2022_NN30')"

      - name: Test with pytest
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          pytest -s --durations=0

      - name: Delay next job
        run: sleep 15