name: Linux

on: 
  push:
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_LinuxUbuntu.yaml'
  workflow_dispatch:

jobs:
  coreTest:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '6.0'

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-activate-base: false
          miniconda-version: "latest"

      - name: Create conda environment
        shell: bash
        run: |
          envName="ci-${{ matrix.python-version }}"
          conda create -y -n $envName python=${{ matrix.python-version }}

      - name: Install PyTorch (CPU) into env
        shell: bash
        run: |
          envName="ci-${{ matrix.python-version }}"
          conda run -n $envName conda install -y -c pytorch -c conda-forge pytorch cpuonly

      - name: Install DGL via conda (th23_cpu label)
        shell: bash
        run: |
          envName="ci-${{ matrix.python-version }}"
          conda run -n $envName conda install -y -c dglteam/label/th23_cpu "dgl>=2.0.0"

      - name: Install remaining Python deps and the project (editable mode)
        shell: bash
        run: |
          envName="ci-${{ matrix.python-version }}"
          conda run -n $envName python -m pip install --upgrade pip setuptools
          conda run -n $envName python -m pip install wheel flask pytest pytest-order pytest-cov
          conda run -n $envName python -m pip install -e .

      - name: Test with pytest and coverage
        shell: bash
        run: |
          envName="ci-${{ matrix.python-version }}"
          conda run -n $envName pytest -s --durations=0 --cov=crystall --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report-${{ github.run_id }}-${{ matrix.python-version }}
          path: htmlcov/

      - name: Delay next job
        if: ${{ matrix.python-version != '3.11' }}
        run: sleep 15
