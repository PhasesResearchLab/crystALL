name: Linux (core)

on: 
  push:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_LinuxUbuntu.yaml'
      - 'pyproject.toml'
  
  pull_request:
    branches: [main]
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_LinuxUbuntu.yaml'
      - 'pyproject.toml'
  
  workflow_dispatch:

jobs:
  coreTest:
    timeout-minutes: 90
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:9.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      
      - name: Free up disk space before dependency install
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android
          docker rmi $(docker images -q) || true
          sudo rm -rf /opt/ghc
          df -h

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install wheel flask pytest pytest-order pytest-cov
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.7.0+cpu" "torchvision==0.22.0+cpu" "torchdata==0.9.0"
          python -m pip install --no-deps 'dgl==2.5.0' -f https://data.dgl.ai/wheels/torch-2.6/repo.html
          python -m pip install -e .

      - name: Test with pytest
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          PYTORCH_NUM_THREADS: 1
          CHGNET_DEVICE: cpu
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest -s --durations=0 --cov=crystall --cov-report=xml;
          else
            pytest -s --durations=0;
          fi

      - name: Upload coverage report
        if: ${{ matrix.python-version == '3.11' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.run_id }}-${{ matrix.python-version }}
          path: coverage.xml

      - name: Delay next job
        run: sleep 15