name: Linux

on: 
  push:
    paths:
      - 'crystall/**'
      - '.github/workflows/coreTests_LinuxUbuntu.yaml'
  workflow_dispatch:

jobs:
  coreTest:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: '6.0'
    
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install wheel flask pytest pytest-order pytest-cov
          python -m pip install 'torch==2.3.0' 'dgl==2.2.0' -f https://data.dgl.ai/wheels/torch-2.3/repo.html
          python -m pip install -e .
          
      - name: Test with pytest
        run: |
          pytest -s --durations=0 --cov=crystall --cov-report=html
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: html-coverage-report-${{ github.run_id }}-${{ matrix.python-version }}
          path: htmlcov/

      - name: Delay next job
        run: sleep 15